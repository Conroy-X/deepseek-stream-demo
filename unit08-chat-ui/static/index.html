<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 8 · Chat UI</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --text:#e6e8ee; --dim:#8b93a5;
    --accent:#4d9fff; --ok:#3ddc97; --err:#ff6b6b; --warn:#ffb454;
    --code-bg:#0b0d12; --kw:#ff79c6; --str:#f1fa8c; --num:#bd93f9;
    --cmt:#6272a4; --fn:#50fa7b;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.75 -apple-system,"Segoe UI","PingFang SC",sans-serif;
         -webkit-text-size-adjust:100%; }
  .wrap { max-width:820px; margin:0 auto; padding:24px 16px 120px; }
  h1 { font-size:19px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:12.5px; margin-bottom:20px; }

  /* ---------- 消息气泡 ---------- */
  .msg { margin-bottom:20px; display:flex; gap:12px; }
  .msg .avatar { flex:0 0 30px; height:30px; border-radius:8px; display:grid;
                 place-items:center; font-size:13px; font-weight:700; background:#20252f; color:var(--dim); }
  .msg.user .avatar { background:var(--accent); color:#04121f; }
  .msg .body { flex:1; min-width:0; }
  .msg .who { font-size:12px; color:var(--dim); margin-bottom:4px; }
  .msg.user .content { background:#1b2230; border-radius:10px; padding:10px 14px; }

  /* ---------- Markdown 渲染 ---------- */
  .md h1,.md h2,.md h3,.md h4 { margin:1.1em 0 .5em; line-height:1.35; }
  .md h1 { font-size:1.45em; } .md h2 { font-size:1.28em; } .md h3 { font-size:1.12em; }
  .md p { margin:.6em 0; }
  .md ul,.md ol { margin:.6em 0; padding-left:1.6em; }
  .md li { margin:.25em 0; }
  .md blockquote { margin:.7em 0; padding:.3em 1em; border-left:3px solid var(--accent);
                   color:#c3c9d6; background:#12151c; border-radius:0 6px 6px 0; }
  .md hr { border:0; border-top:1px solid var(--line); margin:1.3em 0; }
  .md a { color:var(--accent); }
  .md strong { color:#fff; }
  .md code.inline-code { background:#20252f; padding:.15em .4em; border-radius:4px;
                         font:.9em ui-monospace,Consolas,monospace; color:#ffb454; }

  /* ---------- 表格：横向可滚动，避免移动端溢出 ---------- */
  .table-wrap { overflow-x:auto; margin:.8em 0; border:1px solid var(--line); border-radius:8px; }
  .md table { border-collapse:collapse; width:100%; font-size:14px; }
  .md th,.md td { padding:8px 12px; border-bottom:1px solid var(--line); }
  .md th { background:#1b2130; font-weight:600; white-space:nowrap; }
  .md tr:last-child td { border-bottom:0; }

  /* ---------- 代码块 ---------- */
  .code-block { position:relative; margin:.9em 0; border:1px solid var(--line);
                border-radius:8px; overflow:hidden; background:var(--code-bg); }
  .code-head { display:flex; justify-content:space-between; align-items:center;
               padding:6px 12px; background:#12161e; border-bottom:1px solid var(--line); }
  .code-lang { font:11.5px ui-monospace,Consolas,monospace; color:var(--dim);
               text-transform:lowercase; letter-spacing:.5px; }
  .copy-btn { background:transparent; border:1px solid var(--line); color:var(--dim);
              border-radius:5px; padding:3px 10px; font-size:12px; cursor:pointer; }
  .copy-btn:hover { color:var(--text); border-color:var(--accent); }
  .copy-btn.copied { color:var(--ok); border-color:var(--ok); }
  .code-block pre { margin:0; padding:12px 14px; overflow-x:auto; }
  .code-block code { font:13px/1.6 ui-monospace,Consolas,monospace; white-space:pre; }
  .tok-keyword { color:var(--kw); } .tok-string { color:var(--str); }
  .tok-number { color:var(--num); } .tok-comment { color:var(--cmt); font-style:italic; }
  .tok-func { color:var(--fn); }

  /* ---------- 光标 ---------- */
  .cursor::after { content:"▍"; color:var(--accent); animation:blink 1s steps(2) infinite; }
  @keyframes blink { 50%{opacity:0;} }

  /* ---------- 底部输入区（吸底）---------- */
  .inputbar { position:fixed; left:0; right:0; bottom:0; background:linear-gradient(transparent,var(--bg) 30%);
              padding:16px 16px 20px; }
  .inputbar .inner { max-width:820px; margin:0 auto; display:flex; gap:10px;
                     background:var(--panel); border:1px solid var(--line);
                     border-radius:12px; padding:10px 12px; }
  textarea { flex:1; background:transparent; border:0; color:var(--text); resize:none;
             font:15px/1.6 inherit; outline:none; max-height:120px; min-height:24px; }
  button.send { background:var(--accent); color:#04121f; border:0; border-radius:8px;
                padding:8px 18px; font-weight:600; cursor:pointer; }
  button.send:disabled { opacity:.4; cursor:not-allowed; }
  button.stopbtn { background:#2a1f22; color:var(--err); border:1px solid var(--err);
                   border-radius:8px; padding:8px 14px; cursor:pointer; display:none; }

  .stats { display:flex; gap:14px; flex-wrap:wrap; color:var(--dim); font-size:12px;
           margin-top:8px; }
  .stats span b { color:var(--text); font-variant-numeric:tabular-nums; }

  @media (max-width:520px) {
    .wrap { padding:16px 12px 140px; }
    .msg { gap:8px; }
    .msg .avatar { flex-basis:26px; height:26px; font-size:12px; }
    .md { font-size:14.5px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Unit 8 · Chat UI</h1>
  <div class="sub">
    Markdown 渲染 · 代码高亮 · 一键复制 · 自动滚动 · 中途停止
    <span id="backend" style="color:var(--dim)"></span>
  </div>

  <div id="thread"></div>

  <div class="stats" id="stats" style="display:none">
    <span>首字 <b id="ttft">—</b></span>
    <span>总耗时 <b id="total">—</b></span>
    <span>分块 <b id="chunks">0</b></span>
  </div>
</div>

<div class="inputbar">
  <div class="inner">
    <textarea id="q" rows="1" placeholder="输入问题，Enter 发送 / Shift+Enter 换行"></textarea>
    <button class="send" id="btnSend">发送</button>
    <button class="stopbtn" id="btnStop">停止</button>
  </div>
</div>

<script type="module">
import { renderMarkdown, bindCopyButtons, escapeHtml } from "./markdown.js";

const BACKEND = "http://127.0.0.1:8000";
document.getElementById("backend").textContent = `· 后端 ${BACKEND}`;

const thread = document.getElementById("thread");
const qEl = document.getElementById("q");
const btnSend = document.getElementById("btnSend");
const btnStop = document.getElementById("btnStop");
const stats = document.getElementById("stats");

bindCopyButtons(thread);

/* ---------------- SSE 解析 ---------------- */
async function* parseSSE(response) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  try {
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf("\n\n")) !== -1) {
        const raw = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        if (!raw.trim()) continue;
        const payload = raw.split("\n").filter((l) => l.startsWith("data:"))
          .map((l) => l.slice(5).trimStart()).join("\n");
        if (payload) yield payload;
      }
    }
  } finally {
    reader.releaseLock();
  }
}

/* ---------------- 消息渲染 ---------------- */
function addMessage(role, text = "") {
  const div = document.createElement("div");
  div.className = `msg ${role}`;
  div.innerHTML = `
    <div class="avatar">${role === "user" ? "你" : "AI"}</div>
    <div class="body">
      <div class="who">${role === "user" ? "你" : "助手"}</div>
      <div class="content ${role === "user" ? "" : "md"}"></div>
    </div>`;
  const content = div.querySelector(".content");
  if (role === "user") content.textContent = text;
  thread.appendChild(div);
  scrollToBottom();
  return content;
}

/* 流式过程中逐段渲染：每收到一段就重新渲染整段 Markdown */
function renderInto(el, raw) {
  el.innerHTML = renderMarkdown(raw);
}

/* ---------------- 自动滚动（用户上翻时不打断）---------------- */
let stickToBottom = true;
window.addEventListener("scroll", () => {
  const nearBottom = window.innerHeight + window.scrollY >= document.body.offsetHeight - 80;
  stickToBottom = nearBottom;
});
function scrollToBottom(force = false) {
  if (stickToBottom || force) window.scrollTo({ top: document.body.scrollHeight });
}

/* ---------------- 发送 ---------------- */
let controller = null;

async function send() {
  const text = qEl.value.trim();
  if (!text || controller) return;

  qEl.value = "";
  qEl.style.height = "auto";
  addMessage("user", text);

  const aiEl = addMessage("assistant");
  aiEl.classList.add("cursor");
  aiEl.textContent = "";

  controller = new AbortController();
  btnSend.disabled = true;
  btnStop.style.display = "block";
  stats.style.display = "flex";
  document.getElementById("chunks").textContent = "0";
  document.getElementById("ttft").textContent = "—";
  document.getElementById("total").textContent = "—";

  const t0 = performance.now();
  let raw = "";
  let chunks = 0;
  let firstFrame = true;

  try {
    const resp = await fetch(`${BACKEND}/chat/stream`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        messages: [{ role: "user", content: text }],
        temperature: 0.7,
        max_tokens: 1024,
      }),
      signal: controller.signal,
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

    for await (const payload of parseSSE(resp)) {
      if (payload === "[DONE]") break;
      const ev = JSON.parse(payload);
      if (ev.type === "first_token") {
        document.getElementById("ttft").textContent = ev.ttft.toFixed(2) + "s";
      } else if (ev.type === "delta") {
        chunks++;
        document.getElementById("chunks").textContent = chunks;
        raw += ev.content;
        renderInto(aiEl, raw);
        // 用 rAF 节流，避免每个字符都触发重排
        if (firstFrame) { firstFrame = false; requestAnimationFrame(() => scrollToBottom()); }
        else requestAnimationFrame(() => scrollToBottom());
      } else if (ev.type === "done") {
        document.getElementById("total").textContent = ev.elapsed.toFixed(2) + "s";
      } else if (ev.type === "error") {
        aiEl.innerHTML = `<p style="color:var(--err)">出错了：${escapeHtml(ev.message)}</p>`;
      }
    }
  } catch (e) {
    if (e.name === "AbortError") {
      raw += "\n\n*（已停止）*";
      renderInto(aiEl, raw);
    } else {
      aiEl.innerHTML = `<p style="color:var(--err)">请求失败：${escapeHtml(e.message)}</p>`;
    }
  } finally {
    aiEl.classList.remove("cursor");
    if (!raw) aiEl.textContent = "（无输出）";
    controller = null;
    btnSend.disabled = false;
    btnStop.style.display = "none";
    scrollToBottom(true);
  }
  void (performance.now() - t0);
}

btnSend.onclick = send;
btnStop.onclick = () => controller?.abort();

/* Enter 发送，Shift+Enter 换行 */
qEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    send();
  }
});
/* 自适应高度 */
qEl.addEventListener("input", () => {
  qEl.style.height = "auto";
  qEl.style.height = Math.min(qEl.scrollHeight, 120) + "px";
});
</script>
</body>
</html>
