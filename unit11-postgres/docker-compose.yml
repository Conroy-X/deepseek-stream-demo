# 本机已装 PostgreSQL 17 占着 5432，这里用 5433 避开冲突。
# 如果你在一台没装 PG 的机器上，可以把 5433:5432 改回 5432:5432。
services:
  db:
    image: postgres:16
    container_name: pg-ai
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_journey
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_journey"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
