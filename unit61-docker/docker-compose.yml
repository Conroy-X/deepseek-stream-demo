services:
  unit61-docker:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8061:8000"
    environment:
      - PORT=8000
    # 声明式健康检查：compose 层面也能感知
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
