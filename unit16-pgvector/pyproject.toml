[project]
name = "unit16-pgvector"
version = "0.1.0"
description = "Unit 16：pgvector —— 把向量存进 Postgres，用 SQL 做检索"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "numpy>=2.0",  # 只给 bench.py 造数用，服务和单元逻辑不依赖它
]

[tool.uv]
package = false
