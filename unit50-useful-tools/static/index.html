<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 50 · 自定义 Tool 实验台</title>
<style>
  :root{--bg:#f7f7f5;--card:#fff;--line:#e3e2de;--text:#23231f;--dim:#7a7972;--accent:#185FA5;--ok:#0F6E56;--bad:#A32D2D;--warn:#854F0B}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:14px/1.65 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;padding:20px}
  .wrap{max-width:1080px;margin:0 auto}
  h1{font-size:19px;font-weight:600}
  h2{font-size:13px;font-weight:600;color:var(--dim);margin-bottom:11px;letter-spacing:.02em}
  .sub{color:var(--dim);font-size:13px;margin:4px 0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:15px;margin-bottom:14px}
  button{padding:7px 13px;border:1px solid var(--line);border-radius:7px;background:#fff;font:inherit;font-size:13px;cursor:pointer;color:var(--text)}
  button:hover{background:#f0efec}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{background:#0C447C}
  button.mini{padding:3px 9px;font-size:12px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .banner{padding:9px 13px;border-radius:8px;font-size:13px;margin-bottom:14px;border:1px solid var(--line);background:var(--card)}
  .banner.ok{border-color:#9FE1CB;background:#E1F5EE;color:var(--ok)}
  .banner.warn{border-color:#FAC775;background:#FAEEDA;color:var(--warn)}
  .banner.bad{border-color:#F7C1C1;background:#FCEBEB;color:var(--bad)}
  .grid{display:grid;grid-template-columns:340px 1fr;gap:14px;align-items:start}
  @media (max-width:900px){.grid{grid-template-columns:1fr}}
  .tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:20px;border:1px solid var(--line);color:var(--dim)}
  .tag.ok{border-color:#9FE1CB;background:#E1F5EE;color:var(--ok)}
  .tag.bad{border-color:#F7C1C1;background:#FCEBEB;color:var(--bad)}
  .tag.warn{border-color:#FAC775;background:#FAEEDA;color:var(--warn)}
  .tool{border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:8px;cursor:pointer;background:#fff}
  .tool:hover{border-color:#c9c8c3}
  .tool.on{border-color:var(--accent);background:#F2F7FC}
  .tool b{font:12.5px/1.4 ui-monospace,Consolas,monospace;display:block;margin-bottom:3px}
  .tool .d{font-size:12px;color:var(--dim);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:7px;font:13px ui-monospace,Consolas,monospace;background:#fff}
  label{display:block;font-size:12.5px;margin:10px 0 4px;color:var(--text)}
  label .req{color:var(--bad);font-size:11px;margin-left:4px}
  label .t{color:var(--dim);font-size:11px;margin-left:6px;font-family:ui-monospace,Consolas,monospace}
  pre{background:#fbfbf9;border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.6 ui-monospace,Consolas,monospace;overflow:auto;white-space:pre-wrap;word-break:break-word;max-height:320px}
  .ph{color:var(--dim);font-size:13px}
  .note{font-size:12.5px;color:var(--warn);background:#FAEEDA;border:1px solid #FAC775;border-radius:8px;padding:8px 12px;margin-top:10px}
  .note.ok{color:var(--ok);background:#E1F5EE;border-color:#9FE1CB}
  .note.bad{color:var(--bad);background:#FCEBEB;border-color:#F7C1C1}
  code{font:12px ui-monospace,Consolas,monospace;background:#f1f0ec;padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Unit 50 · 自定义 Tool 实验台</h1>
  <div class="sub">下面每个工具都是真的：点一下，后端会起一个 stdio 子进程、握手、调用、关闭 —— 约 0.7 秒那种慢是你应该感觉到的</div>

  <div class="banner" id="health">探测后端…</div>

  <div class="grid">
    <div>
      <div class="card">
        <h2>① 选工具（清单来自 tools/list）</h2>
        <div id="tools"><span class="ph">加载中…</span></div>
      </div>
      <div class="card">
        <h2>② 样例（点一下就填好参数）</h2>
        <div class="row" id="samples"><span class="ph">—</span></div>
        <div class="note" id="samplenote">左边选工具，右边按 <code>input_schema</code> 自动生成的表单填参数。必填项标红。</div>
      </div>
    </div>

    <div>
      <div class="card">
        <h2>③ 参数（按 input_schema 动态生成）</h2>
        <div id="form"><span class="ph">先选一个工具。</span></div>
        <div class="row" style="margin-top:12px">
          <button class="primary" onclick="callTool()">调用</button>
          <button onclick="clearResult()">清空</button>
          <span class="ph" id="formhint"></span>
        </div>
      </div>

      <div class="card">
        <h2>④ 返回（看 is_error 和 content[0].text）</h2>
        <div class="row" style="margin-bottom:8px">
          <span class="tag" id="errtag">未调用</span>
          <span class="ph" id="resmeta"></span>
        </div>
        <pre id="result">还没调用。</pre>
        <div id="resphint"></div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let tools = [], current = null, samples = [];

async function jfetch(path, opts) {
  const r = await fetch(path, opts);
  const d = await r.json().catch(() => ({}));
  return { ok: r.ok, status: r.status, data: d };
}

async function loadHealth() {
  const { data: h } = await jfetch("health");
  if (!h || !h.server) { $("health").className = "banner bad"; $("health").textContent = "后端没响应"; return; }
  $("health").className = "banner ok";
  $("health").textContent = `${h.server.name} v${h.server.version} · 协议 ${h.server.protocol_version} · `
    + `工具 ${h.tool_count} 个 · sales.csv ${h.sales_rows} 行 · notes.log ${h.notes_log_lines} 行`;
}

async function loadTools() {
  const { data: d } = await jfetch("api/tools");
  tools = d.items || [];
  $("tools").innerHTML = tools.length ? tools.map((t, i) => `
    <div class="tool" data-i="${i}" onclick="pick(${i})">
      <b>${esc(t.name)}</b>
      <div class="d">${esc(t.description)}</div>
    </div>`).join("") : '<span class="ph">没有工具。</span>';
  if (tools.length) pick(0);
}

async function loadSamples() {
  const { data: d } = await jfetch("api/samples");
  samples = d.items || [];
  $("samples").innerHTML = samples.map((s, i) =>
    `<button class="mini" onclick="useSample(${i})">${esc(s.tool)}·${esc(Object.values(s.arguments)[0])}</button>`).join("");
}

function pick(i) {
  current = tools[i];
  document.querySelectorAll(".tool").forEach(el => el.classList.toggle("on", Number(el.dataset.i) === i));
  renderForm();
}

function renderForm() {
  const schema = current.input_schema || {};
  const props = schema.properties || {};
  const required = schema.required || [];
  const keys = Object.keys(props);
  if (!keys.length) {
    $("form").innerHTML = '<span class="ph">这个工具不需要参数。</span>';
  } else {
    $("form").innerHTML = keys.map(k => {
      const p = props[k] || {};
      const req = required.includes(k);
      const type = p.type || "string";
      const val = p.default !== undefined ? p.default : "";
      return `<label>${esc(k)}${req ? '<span class="req">必填</span>' : '<span class="t">可选</span>'}
                <span class="t">${esc(type)}</span></label>
              <input id="f-${esc(k)}" data-type="${esc(type)}" data-k="${esc(k)}" value="${esc(val)}"
                     placeholder="${esc(p.title || k)}">`;
    }).join("");
  }
  $("formhint").textContent = `required: ${required.length ? required.join(", ") : "无"}`;
  $("result").textContent = "还没调用。";
  $("errtag").className = "tag";
  $("errtag").textContent = "未调用";
  $("resmeta").textContent = "";
  $("resphint").innerHTML = "";
}

function coerce(input) {
  const raw = input.value.trim();
  const type = input.dataset.type;
  if (raw === "") return undefined;
  if (type === "number" || type === "integer") {
    const n = Number(raw);
    return Number.isNaN(n) ? raw : n;
  }
  if (type === "boolean") return raw === "true";
  return raw;
}

function collect() {
  const args = {};
  document.querySelectorAll("#form input").forEach(inp => {
    const v = coerce(inp);
    if (v !== undefined) args[inp.dataset.k] = v;
  });
  return args;
}

function useSample(i) {
  const s = samples[i];
  const idx = tools.findIndex(t => t.name === s.tool);
  if (idx < 0) return;
  pick(idx);
  Object.entries(s.arguments).forEach(([k, v]) => {
    const inp = document.getElementById("f-" + k);
    if (inp) inp.value = v;
  });
  $("samplenote").textContent = s.note;
}

async function callTool() {
  if (!current) return;
  const args = collect();
  $("result").textContent = "调用中（起子进程 + 握手 + 调用，约 0.7 秒）…";
  $("errtag").className = "tag warn";
  $("errtag").textContent = "运行中";
  const t0 = performance.now();
  const { data: d } = await jfetch("api/call", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name: current.name, arguments: args }),
  });
  const ms = Math.round(performance.now() - t0);
  $("result").textContent = d.text ?? JSON.stringify(d, null, 2);
  $("errtag").className = "tag " + (d.is_error ? "bad" : "ok");
  $("errtag").textContent = d.is_error ? "is_error = true" : "is_error = false";
  $("resmeta").textContent = `${current.name}(${JSON.stringify(args)}) · ${ms} ms · blocks: ${(d.blocks || []).join(",") || "—"}`;
  $("resphint").innerHTML = d.is_error
    ? `<div class="note bad">框架层把它标成失败了。注意 MCP 2.3.0 里未知工具/缺参数<b>不会抛异常</b>，
         而是 <code>is_error=true</code> + 一段脱敏文本。</div>`
    : (String(d.text || "").startsWith("错误")
        ? `<div class="note">工具自己兜住了错误：<code>is_error=false</code>，但文本是可读的中文原因。
             这就是「让模型看懂」的写法。</div>`
        : `<div class="note ok">正常返回。文本是给人/模型读的，不是结构化 JSON —— 想要结构化就该在协议层用 structured output。</div>`);
  await loadHealth();
}

function clearResult() {
  $("result").textContent = "还没调用。";
  $("errtag").className = "tag";
  $("errtag").textContent = "未调用";
  $("resmeta").textContent = "";
  $("resphint").innerHTML = "";
}

(async () => {
  await loadTools();
  await loadSamples();
  await loadHealth();
})();
</script>
</body>
</html>
