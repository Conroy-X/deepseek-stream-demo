[project]
name = "deepseek-stream-demo"
version = "0.1.0"
description = "最小 DeepSeek 流式问答 Demo：参数传问题，流式返回答案"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[tool.uv]
# 这是个应用而不是库，不要尝试把自身装成包
package = false

[tool.fastapi]
# 显式声明 ASGI 应用位置，fastapi dev / fastapi run 就不必靠自动探测了
entrypoint = "main:app"
