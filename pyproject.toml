[project]
name = "ai-journey"
version = "0.1.0"
description = "AI 应用 / LLM / Agent 开发求职路线 · 60 单元可运行学习工程（根目录 main.py 为最早的流式 Demo）"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[tool.uv]
# 这是个应用而不是库，不要尝试把自身装成包
package = false

[tool.fastapi]
# 显式声明 ASGI 应用位置，fastapi dev / fastapi run 就不必靠自动探测了
entrypoint = "main:app"
