<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>企业知识库 · RAG Demo</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f6f7f9; color: #1f2328; }
  header { padding: 16px 24px; background: #fff; border-bottom: 1px solid #e5e7eb; }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; font-size: 13px; color: #6b7280; }
  main { max-width: 860px; margin: 24px auto; padding: 0 16px; }
  .row { display: flex; gap: 8px; }
  #q { flex: 1; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
  button { padding: 10px 18px; border: 0; border-radius: 8px; background: #1d4ed8; color: #fff;
           font-size: 14px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #out { margin-top: 16px; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  .card.refused { border-color: #f59e0b; background: #fffbeb; }
  .card .answer { font-size: 15px; line-height: 1.7; white-space: pre-wrap; }
  .card .hint { margin-top: 8px; font-size: 12px; color: #6b7280; }
  .cite { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #e5e7eb; font-size: 13px; color: #374151; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 999px; background: #eef2ff;
         color: #4338ca; margin-right: 6px; }
</style>
</head>
<body>
<header>
  <h1>企业知识库 · RAG Demo</h1>
  <p>问一个制度/政策问题，看答案与来源引用；资料里没有的会明确拒答。</p>
</header>
<main>
  <div class="row">
    <input id="q" placeholder="例如：退款多久到账 / 年假怎么申请" autocomplete="off">
    <button id="go">提问</button>
  </div>
  <div id="out"></div>
</main>
<script>
async function ask() {
  const q = document.getElementById('q').value.trim();
  const out = document.getElementById('out');
  if (!q) return;
  const btn = document.getElementById('go');
  btn.disabled = true;
  out.innerHTML = '<div class="card"><div class="answer">检索中…</div></div>';
  try {
    const resp = await fetch('/ask?q=' + encodeURIComponent(q));
    const data = await resp.json();
    if (data.refused) {
      out.innerHTML = `<div class="card refused">
        <div class="answer">${data.answer}</div>
        <div class="hint">资料里没有相关内容，所以拒答——这是设计好的行为，不是故障。</div>
      </div>`;
    } else {
      const cites = (data.citations || []).map(c =>
        `<div class="cite"><span class="tag">[${c.n}]</span>${c.source} 第 ${c.page} 页：${c.text}</div>`
      ).join('');
      out.innerHTML = `<div class="card">
        <div class="answer">${data.answer}</div>
        ${cites}
      </div>`;
    }
  } catch (e) {
    out.innerHTML = `<div class="card refused"><div class="answer">请求失败：${e}</div></div>`;
  } finally {
    btn.disabled = false;
  }
}
document.getElementById('go').addEventListener('click', ask);
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
</script>
</body>
</html>
