<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit 20 · 基础 RAG 实验台</title>
<style>
  :root{--bg:#f7f7f5;--card:#fff;--line:#e3e2de;--text:#23231f;--dim:#7a7972;--accent:#185FA5;--ok:#0F6E56;--bad:#A32D2D;--warn:#854F0B}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:14px/1.65 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;padding:20px}
  .wrap{max-width:1040px;margin:0 auto}
  h1{font-size:19px;font-weight:600}h2{font-size:13px;font-weight:600;color:var(--dim);margin-bottom:11px;letter-spacing:.02em}
  .sub{color:var(--dim);font-size:13px;margin:4px 0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:15px;margin-bottom:14px}
  button{padding:7px 13px;border:1px solid var(--line);border-radius:7px;background:#fff;font:inherit;font-size:13px;cursor:pointer;color:var(--text)}
  button:hover{background:#f0efec}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{background:#0C447C}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .ctrls{display:grid;grid-template-columns:2fr 1fr 2fr;gap:10px;margin-bottom:12px}
  .ctrls label{font-size:12px;color:var(--dim);display:block;margin-bottom:4px}
  .ctrls input,.ctrls select{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:13px;background:#fff}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .banner{padding:9px 13px;border-radius:8px;font-size:13px;margin-bottom:14px;border:1px solid var(--line);background:var(--card)}
  .banner.ok{border-color:#9FE1CB;background:#E1F5EE;color:var(--ok)}
  .banner.warn{border-color:#FAC775;background:#FAEEDA;color:var(--warn)}
  .answer{font-size:15px;line-height:1.85}
  .answer.refused{color:var(--warn);background:#FAEEDA;border:1px solid #FAC775;border-radius:8px;padding:10px 13px;font-size:14px}
  sup.cite{font-size:11px;color:var(--accent);font-weight:600;padding:0 1px}
  .ctx{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px;background:#fff}
  .ctx .hd{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--dim);margin-bottom:5px}
  .ctx .tx{font-size:13px;line-height:1.7}
  .bar{height:4px;border-radius:3px;background:#eceae5;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
  .tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:20px;border:1px solid var(--line);color:var(--dim)}
  .tag.ok{color:var(--ok);border-color:#9FE1CB;background:#E1F5EE}
  .tag.bad{color:var(--bad);border-color:#F0C4C4;background:#FBEDED}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
  .stat{border:1px solid var(--line);border-radius:9px;padding:10px 12px}
  .stat b{display:block;font-size:18px;font-weight:600;letter-spacing:-.01em}
  .stat span{font-size:12px;color:var(--dim)}
  details{margin-top:10px;border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:#fbfbf9}
  details summary{font-size:12.5px;color:var(--dim);cursor:pointer}
  pre{font:12.5px/1.75 ui-monospace,"Cascadia Code",monospace;white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto;margin-top:9px}
  .err{color:var(--bad);font-size:12.5px}
  .note{font-size:12.5px;color:var(--warn);background:#FAEEDA;border:1px solid #FAC775;border-radius:8px;padding:8px 12px;margin-top:10px}
  .cols{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}
  @media(max-width:860px){.cols,.ctrls,.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Unit 20 · 基础 RAG 实验台</h1>
  <div class="sub">检索 → 拼上下文 → 生成。分数不够就拒答，答完留一条 trace</div>

  <div class="banner" id="health">探测后端…</div>

  <div class="card">
    <h2>① 提问</h2>
    <div class="ctrls">
      <div><label>question</label><input id="q" value="年假要提前几天申请"></div>
      <div><label>top_k</label>
        <select id="topk"><option>2</option><option selected>3</option><option>5</option></select>
      </div>
      <div><label>拒答阈值 <b id="thrv">0.15</b></label>
        <input id="thr" type="range" min="0" max="0.4" step="0.01" value="0.15">
      </div>
    </div>
    <div class="row" style="margin-bottom:10px" id="samples"></div>
    <div class="row"><button class="primary" onclick="ask()">提问</button>
      <span class="tag" id="mode"></span></div>
  </div>

  <div class="cols">
    <div id="answer"></div>
    <div id="context"></div>
  </div>
  <div id="prompt"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const SAMPLES = ["年假要提前几天申请", "退款多久到账", "一线城市住宿标准", "回滚后先检查什么",
                 "今天天气怎么样", "账号锁定多久"];

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || ("HTTP " + r.status));
  return d;
}

// 只把 [n] 变成上标，其余全部转义 —— 后端返回的答案同样是不可信输入
function cite(s, max) {
  return esc(s).replace(/\[(\d{1,2})\]/g, (m, n) => (+n <= max)
    ? `<sup class="cite">[${n}]</sup>` : m);
}

async function loadHealth() {
  try {
    const h = await (await fetch("health")).json();
    $("health").className = h.api.has_key ? "banner ok" : "banner warn";
    $("health").textContent = h.api.has_key
      ? `API 模式：${h.api.model} @ ${h.api.base_url} · ${h.chunks} 段语料 · 已存 ${h.traces} 条 trace`
      : `离线 extractive 模式（没配 key，不会外调）· ${h.chunks} 段语料 · 已存 ${h.traces} 条 trace · 阈值 ${h.default_threshold}`;
    $("mode").textContent = "当前后端：" + h.mode;
    $("samples").innerHTML = SAMPLES.map(q => `<button onclick="pick(this)">${esc(q)}</button>`).join("");
  } catch (e) {
    $("health").className = "banner warn";
    $("health").textContent = "后端没响应：" + e.message;
  }
}

function pick(el) { $("q").value = el.textContent; ask(); }
$("thr").oninput = () => { $("thrv").textContent = (+$("thr").value).toFixed(2); };

async function ask() {
  $("answer").innerHTML = '<div class="card"><span class="tag">生成中…</span></div>';
  $("context").innerHTML = "";
  $("prompt").innerHTML = "";
  try {
    const d = await post("ask", {
      question: $("q").value,
      top_k: +$("topk").value,
      threshold: +$("thr").value
    });
    $("answer").innerHTML = `
      <div class="card">
        <h2>② 答案</h2>
        <div class="answer ${d.refused ? "refused" : ""}">${cite(d.answer, d.hits.length)}</div>
        <div class="row" style="margin-top:12px">
          <span class="tag ${d.refused ? "bad" : "ok"}">${d.refused ? "已拒答" : "已作答"}</span>
          <span class="tag">${d.mode}</span>
          <span class="tag">${d.elapsed_ms} ms</span>
          <span class="tag">trace ${esc(d.trace_id)}</span>
        </div>
        ${d.usage && d.usage.backend ? `<div class="row" style="margin-top:8px">
          <span class="tag">prompt ${d.usage.prompt_chars} 字</span>
          <span class="tag">answer ${d.usage.answer_chars} 字</span></div>` : ""}
        ${d.refused ? `<div class="note">最高分 ${d.hits.length ? d.hits[0].score.toFixed(3) : "—"} &lt; 阈值 ${(+$("thr").value).toFixed(2)}，
          所以没进生成。把滑杆拉到 0 再看一遍，就知道阈值在起什么作用。</div>` : ""}
      </div>`;
    $("context").innerHTML = `<div class="card"><h2>③ 检索到的上下文</h2>${d.hits.map((h, i) => `
      <div class="ctx">
        <div class="hd"><b>[${i + 1}]</b><span>${esc(h.id)}</span>
          <span>${esc(h.source)} · 第 ${h.page} 页</span><b>${h.score.toFixed(3)}</b></div>
        <div class="tx">${esc(h.text)}</div>
        <div class="bar"><i style="width:${Math.max(2, h.score * 100)}%"></i></div>
      </div>`).join("") || '<div class="err">没有命中</div>'}</div>`;
    $("prompt").innerHTML = `<details><summary>④ 实际发给模型的 prompt（点开看编号上下文长什么样）</summary>
      <pre>${esc(d.prompt)}</pre></details>`;
  } catch (e) {
    $("answer").innerHTML = `<div class="card"><div class="err">${esc(e.message)}</div></div>`;
  }
}

loadHealth();
ask();
</script>
</body>
</html>
