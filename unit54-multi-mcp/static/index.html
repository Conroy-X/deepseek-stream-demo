<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 54 · 多 MCP Server</title>
<style>
  :root{--bg:#f7f7f5;--card:#fff;--line:#e3e2de;--text:#23231f;--dim:#7a7972;
        --accent:#185FA5;--ok:#0F6E56;--bad:#A32D2D;--warn:#854F0B}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.65 -apple-system,"Segoe UI","Noto Sans CJK SC",sans-serif}
  header{padding:26px 30px 18px;border-bottom:1px solid var(--line);background:var(--card)}
  h1{margin:0 0 6px;font-size:19px;font-weight:650;letter-spacing:-.2px}
  header p{margin:0;color:var(--dim);font-size:13px;max-width:780px}
  main{max-width:1100px;margin:0 auto;padding:22px 30px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
  .card h2{margin:0 0 4px;font-size:14px;font-weight:650}
  .card .sub{color:var(--dim);font-size:12.5px;margin:0 0 14px}
  .tag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11.5px;
       background:#eef2f7;color:var(--accent);margin-right:6px}
  .tag.ok{background:#e8f3ef;color:var(--ok)}
  .tag.bad{background:#fbecec;color:var(--bad)}
  .tag.warn{background:#fbf1e3;color:var(--warn)}
  .banner{background:#e8f3ef;border:1px solid #cfe4db;color:var(--ok);
          padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
  .banner.bad{background:#fbecec;border-color:#f0cfcf;color:var(--bad)}
  .banner.warn{background:#fbf1e3;border-color:#eee0c8;color:var(--warn)}
  pre{margin:0;background:#1e1e1c;color:#e6e4dd;padding:12px 14px;border-radius:8px;
      font:12px/1.55 ui-monospace,"Cascadia Code",Menlo,monospace;overflow:auto;max-height:340px;
      white-space:pre-wrap;word-break:break-word}
  button{font:inherit;font-size:12.5px;padding:6px 13px;border-radius:7px;cursor:pointer;
         border:1px solid var(--line);background:#fff;color:var(--text)}
  button:hover{border-color:#c9c8c2}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{background:#14538f}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .srv{border:1px solid var(--line);border-radius:9px;padding:12px 14px;background:#fcfcfb}
  .srv.bad{border-color:#f0cfcf;background:#fdf7f7}
  .srv h4{margin:0 0 6px;font-size:13px;font-weight:650}
  .srv .light{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
  .srv .light.on{background:var(--ok)}
  .srv .light.off{background:var(--bad)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--dim);font-weight:500;font-size:11.5px}
  td code{background:#f2f1ed;padding:1px 5px;border-radius:4px;font-size:11.5px}
  .foot{color:var(--dim);font-size:12px;text-align:center;padding-top:8px}
  @media(max-width:860px){.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>Unit 54 · 多 MCP Server</h1>
  <p>同时挂 3 个 stdio 子进程，工具名加命名空间前缀防冲突。一个 server 起不来时，剩下仍可用。</p>
</header>

<main>
  <div class="banner" id="banner"></div>

  <section class="card">
    <h2>三个 server 的连接状态</h2>
    <p class="sub">math / text / db 各自一个 stdio 子进程。</p>
    <div class="grid3" id="servers"><div class="sub">加载中…</div></div>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="primary" id="btnSnap">刷新</button>
      <button id="btnDeg">模拟一个 server 失败</button>
    </div>
  </section>

  <section class="card">
    <h2>聚合工具清单（带前缀）</h2>
    <p class="sub">db.add 与 math.add 都叫 add，靠前缀隔离。冲突会被挑出。</p>
    <table id="tools"><thead><tr><th>namespace</th><th>原始名</th><th>聚合名</th><th>描述</th></tr></thead><tbody></tbody></table>
    <div class="note" style="background:#fbfaf7;border-left:2px solid var(--line);padding:9px 12px;color:var(--dim);font-size:12.5px;border-radius:0 6px 6px 0;margin-top:12px" id="conflictNote"></div>
  </section>

  <section class="card">
    <h2>关键词路由</h2>
    <p class="sub">按问题关键词路由到对应 namespace。</p>
    <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">
      <button data-q="两数相加">两数相加 → math</button>
      <button data-q="转大写">转大写 → text</button>
      <button data-q="查库存">查库存 → db</button>
      <button data-q="今天天气">无关问题</button>
    </div>
    <pre id="routeOut" style="min-height:60px">点按钮。</pre>
  </section>

  <div class="foot">8054 · 离线自检见 <code>python main.py</code></div>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function banner(msg, kind){
  const el = $('banner');
  el.textContent = msg; el.className = 'banner' + (kind ? ' ' + kind : '');
  el.style.display = msg ? 'block' : 'none';
}
async function getJSON(url, opts){
  const r = await fetch(url, opts);
  if(!r.ok) throw new Error(url + ' → ' + r.status + ' ' + (await r.text()).slice(0,150));
  return r.json();
}

async function loadSnap(url){
  const d = await getJSON(url);
  $('servers').innerHTML = d.statuses.map(s => `
    <div class="srv ${s.connected ? '' : 'bad'}">
      <h4><span class="light ${s.connected ? 'on' : 'off'}"></span>${esc(s.name)}</h4>
      <div style="font-size:11.5px;color:var(--dim)">${esc(s.path.split('/').pop())}</div>
      <div style="margin-top:6px">${s.connected
        ? `<span class="tag ok">已连</span>${s.tool_count} 个工具`
        : `<span class="tag bad">未连</span><code style="font-size:11px">${esc((s.error||'').slice(0,80))}</code>`}</div>
    </div>`).join('');

  $('tools').querySelector('tbody').innerHTML = d.tools.map(t => `
    <tr>
      <td><span class="tag">${esc(t.namespace)}</span></td>
      <td><code>${esc(t.raw_name)}</code></td>
      <td><code>${esc(t.name)}</code></td>
      <td style="color:var(--dim)">${esc(t.description)}</td>
    </tr>`).join('');

  const conflicts = d.conflicts;
  const keys = Object.keys(conflicts);
  $('conflictNote').textContent = keys.length
    ? `冲突：${keys.map(k => `${k} 出现在 ${conflicts[k].join('/')}`).join('；')}。靠前缀隔离后无歧义。`
    : '没有跨 namespace 的同名冲突。';

  return d;
}

$('btnSnap').onclick = async () => {
  try{ await loadSnap('/api/snapshot'); banner(`连上 3 个 server，6 个工具，1 处冲突（add）。`, 'ok'); }
  catch(e){ banner(e.message, 'bad'); }
};

$('btnDeg').onclick = async () => {
  try{
    const d = await loadSnap('/api/degraded');
    banner(`故意让 broken 失败：连 ${d.connected} 个、失败 ${d.failed} 个。剩下仍可用。`, 'warn');
  }catch(e){ banner(e.message, 'bad'); }
};

document.querySelectorAll('[data-q]').forEach(btn => {
  btn.onclick = async () => {
    $('routeOut').textContent = '路由中…';
    try{
      const d = await getJSON('/api/ask', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({question: btn.dataset.q})
      });
      $('routeOut').textContent = JSON.stringify(d, null, 2);
      banner(d.routed_to ? `路由到 ${d.routed_to}` : '没匹配上任何 server', d.routed_to ? 'ok' : 'warn');
    }catch(e){ $('routeOut').textContent = e.message; banner(e.message, 'bad'); }
  };
});

(async () => {
  try{ await loadSnap('/api/snapshot'); }
  catch(e){ banner(e.message, 'bad'); }
})();
</script>
</body>
</html>
