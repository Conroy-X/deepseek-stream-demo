<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit 39 · Conditional Edge</title><style>:root{--bg:#f7f7f5;--card:#fff;--line:#e3e2de;--text:#23231f;--dim:#7a7972;--accent:#185FA5;--ok:#0F6E56;--bad:#A32D2D}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.65 -apple-system,sans-serif}header{padding:26px 30px;border-bottom:1px solid var(--line);background:var(--card)}h1{margin:0 0 6px;font-size:19px}main{max-width:1000px;margin:0 auto;padding:22px 30px}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}pre{background:#1e1e1c;color:#e6e4dd;padding:12px;border-radius:8px;font:12px/1.55 ui-monospace,Menlo,monospace;overflow:auto;max-height:300px;white-space:pre-wrap}button{font:inherit;padding:6px 13px;border-radius:7px;border:1px solid var(--line);cursor:pointer}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}input{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;width:100%}</style></head><body><header><h1>Unit 39 · Conditional Edge</h1><p>条件路由：简单问题直接回答，复杂问题走搜索，未知问题走兜底。</p></header><main><div class="card"><h2>试试不同类型的问题</h2><div style="display:flex;gap:8px;margin-bottom:10px"><input id="q" value="MCP 是什么？"><button class="primary" onclick="run()">跑</button></div><div style="display:flex;gap:6px;margin-bottom:10px"><button onclick="setQ(你好)">简单（你好）</button><button onclick="setQ(MCP 是什么？)">复杂</button><button onclick="setQ(xxx)">未知</button></div><pre id="out">点按钮。</pre></div></main><script>const e=async(u,o)=>{const r=await fetch(u,o);return r.json()};async function run(){const d=await e("/api/run",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:document.getElementById("q").value})});document.getElementById("out").textContent=JSON.stringify(d,null,2)}function setQ(q){document.getElementById("q").value=q}</script></body></htm
